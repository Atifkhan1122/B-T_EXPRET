<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BET PRO EXPERT | VIP Portal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffd700">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #ffd700; 
            --dark-gold: #b8860b; 
            --bg-gradient: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%);
            --card-bg: #1e1e1e; 
            --inactive-btn: #2a2a2a; 
            --win: #00e676; 
            --loss: #ff5252; 
            --theme-color: #ffd700;
        }
        
        body.vip-active { --theme-color: #00e676; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg-gradient); background-attachment: fixed; color: #ffffff; overflow-x: hidden; touch-action: pan-y; }

        /* Navbar */
        nav { background: rgba(0,0,0,0.95); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--theme-color); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); transition: 0.4s; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .menu-toggle { font-size: 22px; color: var(--theme-color); cursor: pointer; }
        
        .brand-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-text { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .logo-text .bt { color: var(--theme-color); }
        .logo-text .expert { color: #ffffff; }

        /* Side Navigation Drawer */
        .side-drawer { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #111; z-index: 6000; transition: 0.3s ease-in-out; border-right: 2px solid var(--theme-color); padding: 20px 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 5px 0 15px rgba(0,0,0,0.8); }
        .side-drawer.open { left: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #333; margin-bottom: 10px; }
        .close-drawer { font-size: 22px; color: #fff; cursor: pointer; }
        .drawer-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 10px; background: var(--inactive-btn); color: #ccc; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid #222; }
        .drawer-item i { font-size: 18px; color: var(--theme-color); width: 22px; text-align: center; }
        .drawer-item.active { background: linear-gradient(145deg, #00e676, #00a855); color: #000; border-color: #fff; }
        .drawer-item.active i { color: #000; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 5500; backdrop-filter: blur(3px); }
        .overlay.active { display: block; }

        .container { padding: 15px; max-width: 600px; margin: auto; }

        .search-box { width: 100%; padding: 12px 15px; border-radius: 12px; background: #121212; border: 1px solid #333; color: #fff; margin-bottom: 15px; font-size: 13px; outline: none; }
        .search-box:focus { border-color: var(--theme-color); }

        /* Match Cards */
        .match-card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: grid; grid-template-columns: 75px 1fr 85px; align-items: center; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 6px 14px rgba(0,0,0,0.4); }
        .m-time { font-size: 11px; font-weight: 800; color: var(--theme-color); text-align: center; border-right: 1.5px solid #333; padding-right: 8px; }
        .m-teams { font-weight: 600; font-size: 13.5px; color: #f0f0f0; padding: 0 10px; line-height: 1.35; }
        .tag { font-size: 8px; background: rgba(255,255,255,0.05); color: #ccc; padding: 3px 7px; border-radius: 6px; border: 0.5px solid #444; font-weight: bold; margin-right: 4px; display: inline-block; margin-top: 4px; }

        .tip-btn { background: linear-gradient(180deg, var(--gold), var(--dark-gold)); color: #000; font-weight: 800; font-size: 10px; padding: 10px 4px; border-radius: 10px; text-align: center; border: 1px solid #fff; cursor: pointer; text-transform: uppercase; }

        .window-content { display: none; }
        .window-content.active { display: block; }
        .no-data { text-align: center; color: #888; font-size: 12px; padding: 20px; }
    </style>
</head>
<body>

    <div class="overlay active" id="drawerOverlay" onclick="toggleDrawer()"></div>
    
    <!-- Side Navigation Drawer -->
    <div class="side-drawer open" id="sideDrawer">
        <div class="drawer-header">
            <div class="brand-logo">
                <i class="fas fa-crown" style="font-size: 24px; color: var(--theme-color);"></i>
                <div class="logo-text"><span class="bt">BET PRO</span> <span class="expert">EXPERT</span></div>
            </div>
            <i class="fas fa-times close-drawer" onclick="toggleDrawer()"></i>
        </div>
        <div class="drawer-item" onclick="selectSection('freetips', 0)"><i class="fas fa-bolt"></i> FREE TIPS</div>
        <div class="drawer-item" onclick="selectSection('football', 1)"><i class="fas fa-futbol"></i> FOOTBALL</div>
        <div class="drawer-item active" onclick="selectSection('cricket', 2)"><i class="fas fa-baseball-bat-ball"></i> CRICKET</div>
        <div class="drawer-item" onclick="selectSection('tennis', 3)"><i class="fas fa-table-tennis-paddle-ball"></i> TENNIS</div>
        <div class="drawer-item" onclick="selectSection('cricketCalc', 4)"><i class="fas fa-calculator"></i> CRICKET CALCULATOR</div>
        <div class="drawer-item" onclick="selectSection('footballCalc', 5)"><i class="fas fa-calculator"></i> FOOTBALL CALCULATOR</div>
        <div class="drawer-item" onclick="selectSection('results', 6)"><i class="fas fa-history"></i> RESULTS</div>
        <div class="drawer-item" onclick="selectSection('contact', 7)"><i class="fab fa-whatsapp"></i> CONTACT ADMIN</div>
    </div>

    <!-- Top Navigation -->
    <nav>
        <div class="nav-left">
            <i class="fas fa-bars menu-toggle" onclick="toggleDrawer()"></i>
            <div class="brand-logo">
                <i class="fas fa-crown" style="font-size: 20px; color: var(--theme-color);"></i>
                <div class="logo-text"><span class="bt">BET PRO</span> <span class="expert">EXPERT</span></div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container">
        <input type="text" class="search-box" id="matchSearch" placeholder="🔍 Search Team or Match..." onkeyup="filterMatches()">

        <div id="freetips" class="window-content"></div>
        <div id="football" class="window-content"></div>
        <div id="cricket" class="window-content active"></div>
        <div id="tennis" class="window-content"></div>
        <div id="cricketCalc" class="window-content"></div>
        <div id="footballCalc" class="window-content"></div>
        <div id="results" class="window-content"></div>
        <div id="contact" class="window-content"></div>
    </div>

    <script>
        function toggleDrawer() {
            document.getElementById('sideDrawer').classList.toggle('open');
            document.getElementById('drawerOverlay').classList.toggle('active');
        }

        function selectSection(id, idx) {
            toggleDrawer();
            openWindow(id, idx);
        }

        function openWindow(id, idx) {
            document.querySelectorAll('.window-content').forEach(w => w.classList.remove('active'));
            document.querySelectorAll('.drawer-item').forEach(d => d.classList.remove('active'));

            let targetWin = document.getElementById(id);
            if (targetWin) targetWin.classList.add('active');
            
            if (document.querySelectorAll('.drawer-item')[idx]) {
                document.querySelectorAll('.drawer-item')[idx].classList.add('active');
            }
        }

        // Fetch Cricket Matches from cricket.json
        async function loadCricketData() {
            const container = document.getElementById('cricket');
            try {
                const response = await fetch('cricket.json');
                if (!response.ok) throw new Error('Data load nahi ho saka');
                const matches = await response.json();

                if (matches.length === 0) {
                    container.innerHTML = '<div class="no-data">Koi matches available nahi hain.</div>';
                    return;
                }

                let html = '';
                matches.forEach(item => {
                    html += `
                        <div class="match-card">
                            <div class="m-time">${item.time}</div>
                            <div class="m-teams">
                                <div>${item.teams}</div>
                                <span class="tag">${item.info}</span>
                            </div>
                            <div class="tip-btn">${item.tip}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = '<div class="no-data">Data load karne me masla aaya. Check karein cricket.json file sahi jagah par hai.</div>';
            }
        }

        window.onload = () => { 
            openWindow('cricket', 2);
            document.getElementById('sideDrawer').classList.add('open');
            document.getElementById('drawerOverlay').classList.add('active');
            loadCricketData();
        };
    </script>
</body>
</html>
